[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gram-sam"
version = "1.0.0"
description = "Granular Matrix-Driven Active Semi-Supervised Learning with SAM 2"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26,<3",
  "opencv-python>=4.9",
  "pandas>=2.2",
  "scipy>=1.12",
  "scikit-learn>=1.4",
  "torch==2.4.1",
  "torchvision==0.19.1",
  "torch-geometric>=2.5",
  "tqdm>=4.66",
]

[project.optional-dependencies]
medical = ["SimpleITK>=2.3", "MedPy>=0.5"]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["gram_sam*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
